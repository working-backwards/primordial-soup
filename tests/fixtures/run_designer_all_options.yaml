name: designer_all_options
title: "Designer — every optional block enabled"
description: "Fixture exercising every YAML key the run designer can emit."
value_unit: "$M"

environment:
  family: discovery_heavy
  time:
    tick_horizon: 200
    tick_label: week
  staffing_response:
    flywheel: [0.3, 0.8]
    right_tail: [0.8, 2.0]
  opportunity_supply:
    right_tail_prize_count: 50
    flywheel_count: 40
    enabler_count: 30
    quick_win_count: 60
    frontier_degradation_rate:
      flywheel: 0.01
      quick_win: 0.02
    right_tail_refresh_degradation: 0.10
  model:
    exec_attention_budget: 30.0
    base_signal_st_dev_default: 0.15
    dependency_noise_exponent: 1.0
    default_initial_quality_belief: 0.5
    reference_ceiling: 50.0
    attention_noise_scale: 1.3
    attention_noise_decay: 1.5
    learning_rate: 0.1
    dependency_learning_scale: ~
    execution_signal_st_dev: 0.15
    execution_learning_rate: 0.1
    max_portfolio_capability: 3.0
    capability_decay: 0.005

architecture:
  total_labor_endowment: 210
  team_count: 21
  team_sizes: [10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10]
  ramp_period: 2
  ramp_shape: linear
  low_quality_belief_threshold: 0.3
  max_low_quality_belief_labor_share: 0.4
  max_single_initiative_labor_share: 0.5
  portfolio_mix_targets:
    targets:
      flywheel: 0.40
      quick_win: 0.35
      enabler: 0.15
      right_tail: 0.10
    tolerance: 0.10
  baseline_value_per_team_week: 0.1

policy:
  preset: patient_moonshot

world_seeds: [42, 43]

reporting:
  record_manifest: true
  record_per_tick_logs: true
  record_event_log: false
